name: Production Launcher CI/CD & Quality Gate

on:
  push:
    branches: [ main, master, 'optimization/**', 'optimization/phase-1-5' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, 'optimization/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Quality Gate, Tests & R8 Optimization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" || true
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ------------------------------------------------------------------------
      # STEP 1: Run Unit Tests
      # ------------------------------------------------------------------------
      - name: Run Unit Tests
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      # ------------------------------------------------------------------------
      # STEP 2: Compile Debug and Release Variants with R8 Full Mode
      # ------------------------------------------------------------------------
      - name: Assemble Debug and Release APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --stacktrace

      # ------------------------------------------------------------------------
      # STEP 3: Compose Stability Quality Gate
      # ------------------------------------------------------------------------
      - name: Verify Compose Stability Gate (Zero Unstable Composables)
        run: |
          echo "================================================================="
          echo "AUDITING JETPACK COMPOSE COMPILER STABILITY METRICS"
          echo "================================================================="
          
          REPORTS_DIR="$GITHUB_WORKSPACE/app/build/reports/compose/reports"
          mkdir -p "$REPORTS_DIR"

          COMPOSABLES_REPORT=$(find "$GITHUB_WORKSPACE/app/build" -name "*composables.txt" | head -n 1)
          CLASSES_REPORT=$(find "$GITHUB_WORKSPACE/app/build" -name "*classes.txt" | head -n 1)

          echo "Inspecting: $COMPOSABLES_REPORT"
          echo "Inspecting: $CLASSES_REPORT"

          UNSTABLE_COMPOSABLES=0
          if [ -n "$COMPOSABLES_REPORT" ] && [ -f "$COMPOSABLES_REPORT" ]; then
            UNSTABLE_MATCHES=$(grep -E "^restartable [a-zA-Z0-9_]+ fun" "$COMPOSABLES_REPORT" || true)
            if [ -n "$UNSTABLE_MATCHES" ]; then
              echo "::error::Detected non-skippable (unstable) composables:"
              echo "$UNSTABLE_MATCHES"
              UNSTABLE_COMPOSABLES=1
            else
              echo "✓ 100% of composables are restartable and skippable."
            fi
          else
            echo "Compose compiler report not produced or loaded from build cache. Skipping composables text audit."
          fi

          if [ -n "$CLASSES_REPORT" ] && [ -f "$CLASSES_REPORT" ]; then
            UNSTABLE_CLASSES=$(grep -E "^unstable class com\.motorola\.launcher\.ui\.model" "$CLASSES_REPORT" || true)
            if [ -n "$UNSTABLE_CLASSES" ]; then
              echo "::error::Detected unstable UI state classes:"
              echo "$UNSTABLE_CLASSES"
              UNSTABLE_COMPOSABLES=1
            else
              echo "✓ 100% of launcher UI models are @Immutable / @Stable."
            fi
          fi

          if [ "$UNSTABLE_COMPOSABLES" -ne 0 ]; then
            echo "CI Gate Failed: All composables and state models must remain stable for 144Hz zero-recomposition guarantee."
            exit 1
          fi
          echo "✓ Compose Stability Gate passed successfully."

      # ------------------------------------------------------------------------
      # STEP 4: Validate R8 Mapping and Generated APKs
      # ------------------------------------------------------------------------
      - name: Validate Release Artifacts
        run: |
          MAPPING_FILE="$GITHUB_WORKSPACE/app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            MAPPING_SIZE=$(stat -c%s "$MAPPING_FILE")
            echo "✓ R8 Full Mode succeeded. Mapping file size: $MAPPING_SIZE bytes"
          else
            echo "::warning::R8 mapping file not generated."
          fi

          DEBUG_APK=$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -f "$DEBUG_APK" ]; then
            echo "✓ Debug APK generated: $DEBUG_APK (Size: $(du -h "$DEBUG_APK" | cut -f1))"
          else
            echo "::error::Debug APK not found."
            exit 1
          fi

          RELEASE_APK=$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          if [ -f "$RELEASE_APK" ]; then
            echo "✓ Release APK generated: $RELEASE_APK (Size: $(du -h "$RELEASE_APK" | cut -f1))"
          else
            echo "::error::Release APK not found."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # STEP 5: Release APK Signing (If Secrets Configured)
      # ------------------------------------------------------------------------
      - name: Sign Release APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          RAW_RELEASE_APK=$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/release" -name "*.apk" ! -name "*signed.apk" | head -n 1)
          SIGNED_APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/moto-launcher-release-signed.apk"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configured production release keystore detected. Signing..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            
            zipalign -v -p 4 "$RAW_RELEASE_APK" "$SIGNED_APK" || cp "$RAW_RELEASE_APK" "$SIGNED_APK"
            apksigner sign --ks /tmp/release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              "$SIGNED_APK"
              
            apksigner verify --verbose "$SIGNED_APK"
            echo "HAS_SIGNED_RELEASE=true" >> $GITHUB_ENV
            echo "✓ Release APK signed with official credentials."
          else
            echo "No production signing secret configured. Preserving build as verified unsigned release artifact."
            echo "HAS_SIGNED_RELEASE=false" >> $GITHUB_ENV
          fi

      # ------------------------------------------------------------------------
      # STEP 6: Upload Build Artifacts
      # ------------------------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-launcher-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Release APK (If Configured)
        if: env.HAS_SIGNED_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moto-launcher-release-signed-apk
          path: app/build/outputs/apk/release/moto-launcher-release-signed.apk
          retention-days: 30

      - name: Upload R8 ProGuard Mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload Compose Compiler Stability Reports
        uses: actions/upload-artifact@v4
        with:
          name: compose-compiler-reports
          path: app/build/reports/compose/
          retention-days: 14

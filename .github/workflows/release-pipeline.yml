name: Production Launcher CI/CD & Performance Pacing Gate

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Stability Gate & R8 Optimization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Build Tools PATH
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle 9.6 with Dependency & Build Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ------------------------------------------------------------------------
      # STEP 1: Kotlin 2.4.20 K2 Compilation & Compose Compiler Metrics Run
      # ------------------------------------------------------------------------
      - name: Compile Release with R8 Full Mode & Compose Metrics
        run: |
          gradle assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --stacktrace

      # ------------------------------------------------------------------------
      # STEP 2: Strict Compose Stability CI Quality Gate
      # ------------------------------------------------------------------------
      - name: Verify Compose Stability Gate (Zero Unstable Composables)
        run: |
          echo "================================================================="
          echo "AUDITING JETPACK COMPOSE 1.12 COMPILER STABILITY METRICS"
          echo "================================================================="
          
          REPORTS_DIR="$GITHUB_WORKSPACE/app/build/reports/compose/reports"
          mkdir -p "$REPORTS_DIR"

          COMPOSABLES_REPORT=$(find "$GITHUB_WORKSPACE/app/build" -name "*composables.txt" | head -n 1)
          CLASSES_REPORT=$(find "$GITHUB_WORKSPACE/app/build" -name "*classes.txt" | head -n 1)

          echo "Inspecting: $COMPOSABLES_REPORT"
          echo "Inspecting: $CLASSES_REPORT"

          UNSTABLE_COMPOSABLES=0
          if [ -n "$COMPOSABLES_REPORT" ] && [ -f "$COMPOSABLES_REPORT" ]; then
            # Search for restartable composables that are NOT skippable
            # In Compose compiler metrics: "restartable skippable" is expected; "restartable" alone indicates unstable params
            UNSTABLE_MATCHES=$(grep -E "^restartable [a-zA-Z0-9_]+ fun" "$COMPOSABLES_REPORT" || true)
            if [ -n "$UNSTABLE_MATCHES" ]; then
              echo "::error::Detected non-skippable (unstable) composables:"
              echo "$UNSTABLE_MATCHES"
              UNSTABLE_COMPOSABLES=1
            else
              echo "✓ 100% of composables are restartable and skippable."
            fi
          else
            echo "Compose compiler report not produced or loaded from build cache. Skipping composables text audit."
          fi

          if [ -n "$CLASSES_REPORT" ] && [ -f "$CLASSES_REPORT" ]; then
            # Scan for unstable data classes in launcher domain
            UNSTABLE_CLASSES=$(grep -E "^unstable class com\.motorola\.launcher" "$CLASSES_REPORT" || true)
            if [ -n "$UNSTABLE_CLASSES" ]; then
              echo "::error::Detected unstable UI state classes:"
              echo "$UNSTABLE_CLASSES"
              UNSTABLE_COMPOSABLES=1
            else
              echo "✓ 100% of launcher UI models are @Immutable / @Stable."
            fi
          fi

          if [ "$UNSTABLE_COMPOSABLES" -ne 0 ]; then
            echo "CI Gate Failed: All composables and state models must remain stable for 144Hz zero-recomposition guarantee."
            exit 1
          fi
          echo "✓ Compose Stability Gate passed successfully."

      # ------------------------------------------------------------------------
      # STEP 3: Baseline Profile Verification & Mapping Validation
      # ------------------------------------------------------------------------
      - name: Validate Baseline Profile & R8 ProGuard Output
        run: |
          MAPPING_FILE="$GITHUB_WORKSPACE/app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            MAPPING_SIZE=$(stat -c%s "$MAPPING_FILE")
            echo "✓ R8 Full Mode succeeded. Mapping file size: $MAPPING_SIZE bytes"
          else
            echo "::warning::R8 mapping file not generated."
          fi

          APK_FILE=$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
            echo "✓ Release APK generated: $APK_FILE (Size: $APK_SIZE)"
          else
            echo "::error::Release APK not found."
            exit 1
          fi

      # ------------------------------------------------------------------------
      # STEP 4: Automated APK Signing via GitHub Secrets
      # ------------------------------------------------------------------------
      - name: Sign Release APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/release" -name "*unsigned.apk" -o -name "*release.apk" | head -n 1)
          SIGNED_APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/moto-launcher-release-signed.apk"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            
            # Align and sign with APK Signature Scheme v2, v3, v4
            zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK" || cp "$UNSIGNED_APK" "$SIGNED_APK"
            apksigner sign --ks /tmp/release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              "$SIGNED_APK"
              
            apksigner verify --verbose "$SIGNED_APK"
            echo "✓ Production APK signed with v2/v3/v4 signatures."
          else
            echo "Generating ephemeral CI test key for artifact signing..."
            keytool -genkey -v -keystore /tmp/ci_test.keystore -alias ciKey -keyalg RSA -keysize 2048 -validity 10000 -storepass testpass -keypass testpass -dname "CN=MotorolaLauncherCI"
            zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK" || cp "$UNSIGNED_APK" "$SIGNED_APK"
            apksigner sign --ks /tmp/ci_test.keystore --ks-pass pass:testpass --key-pass pass:testpass "$SIGNED_APK"
            echo "✓ Ephemeral CI signing verified."
          fi

      # ------------------------------------------------------------------------
      # STEP 5: Upload Build Artifacts
      # ------------------------------------------------------------------------
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-launcher-release-apk
          path: app/build/outputs/apk/release/*signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 ProGuard Mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload Compose Compiler Stability Reports
        uses: actions/upload-artifact@v4
        with:
          name: compose-compiler-reports
          path: app/build/reports/compose/
          retention-days: 14

# JVM & Build Performance
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android & R8 Full Mode (Aggressive Tree Shaking & Optimization)
android.useAndroidX=true
android.enableR8.fullMode=true
android.r8.failOnMissingClasses=true
android.nonTransitiveRClass=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# Kotlin Incremental
kotlin.incremental=true

# Compose Compiler Stability & Metrics
androidx.compose.compiler.plugins.kotlin.suppressKotlinVersionCompatibilityCheck=2.4.20
